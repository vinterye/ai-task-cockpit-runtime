<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总控交互 · 个人 AI 任务驾驶舱</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        @media (min-width: 900px) {
            .cockpit-topbar {
                display: grid !important;
                grid-template-columns: 286px minmax(0, 1fr) auto;
                align-items: center;
            }
            .cockpit-topbar #header-left-container {
                width: auto !important;
                justify-content: flex-start !important;
            }
            .cockpit-topbar #workflow-stages-bar {
                justify-self: center;
                max-width: 100%;
            }
            .cockpit-topbar #header-stats-wrapper {
                justify-self: end;
            }
        }
        .sidebar-status-grid {
            display: grid;
            grid-template-columns: 14px 104px auto;
            align-items: center;
            min-width: 0;
        }
        .sidebar-status-title {
            min-width: 0;
            width: 104px;
            max-width: 104px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sidebar-status-value {
            justify-self: start;
            white-space: nowrap;
            padding-left: 16px;
        }
        #sidebar { width: 216px; }
        #sidebar.w-16 { width: 64px; }
        #sidebar .sidebar-status-value {
            position: absolute;
            left: 166px;
            padding-left: 0;
        }
        #sidebar { position: relative; }
        #sidebar.w-16 .sidebar-status-value { display: none; }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden bg-[#f8fafc] text-slate-800 selection:bg-blue-500 selection:text-white">

    <header class="cockpit-topbar border-b border-slate-200 bg-white px-4 py-1 flex flex-col xl:flex-row items-center justify-between shrink-0 z-30 shadow-sm gap-1">
        
        <!-- Left: Brand + Task Switcher Dropdown (or Back button when in create mode) -->
        <div class="flex items-center space-x-4 w-full xl:w-auto justify-between xl:justify-start" id="header-left-container">
            <!-- Rendered by JS -->
        </div>

        <!-- Center: Complete 7-Stage Horizontal Workflow Bar -->
        <div class="flex items-center space-x-1 sm:space-x-1.5 overflow-x-auto max-w-full py-1 px-2 bg-slate-50 border border-slate-200 rounded-xl" id="workflow-stages-bar">
            <!-- Populated by JS -->
        </div>

        <!-- Right Quick Stats -->
        <div class="hidden lg:flex items-center space-x-2 text-xs text-slate-600" id="header-stats-wrapper">
            <div class="flex items-center space-x-1.5 bg-slate-50 px-2 py-1 rounded-md border border-slate-200">
                <span class="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
                <span>正在运行项目</span>
                <span class="font-semibold text-slate-800" id="stat-projects">0</span>
            </div>
            <div class="flex items-center space-x-1.5 bg-slate-50 px-2 py-1 rounded-md border border-slate-200">
                <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                <span>正在运行节点</span>
                <span class="font-semibold text-slate-800" id="stat-nodes">0</span>
            </div>
            <div class="flex items-center space-x-1.5 bg-red-50 border border-red-200 px-2 py-1 rounded-md text-red-700">
                <i class="fa-solid fa-triangle-exclamation text-[10px]"></i>
                <span>阻塞</span>
                <span class="font-semibold text-red-800" id="stat-blocked">0</span>
            </div>
            <div class="flex items-center space-x-1.5 bg-amber-50 border border-amber-200 px-2 py-1 rounded-md text-amber-700">
                <i class="fa-solid fa-triangle-exclamation text-[10px]"></i>
                <span>预测问题</span>
                <span class="font-semibold text-amber-800" id="stat-issues">0</span>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">

        <!-- LEFT ASSET SIDEBAR -->
        <aside id="sidebar" class="w-[216px] bg-white border-r border-slate-200 flex flex-col shrink-0 transition-all duration-300 z-20 shadow-sm">
            <div class="p-3 border-b border-slate-100 flex items-center justify-end">
                <button onclick="startCreateTaskFlow()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-2.5 py-1.5 rounded-md flex items-center space-x-1.5 shadow-sm transition-colors shrink-0">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span class="sidebar-text">+ 创建任务</span>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto py-2 px-2 space-y-1 text-xs">
                <div class="mb-3">
                    <button id="sidebar-projects-toggle" onclick="sidebarProjectsOpen=!sidebarProjectsOpen; renderSidebarProjects()" class="w-full flex items-center justify-between px-2 py-1 text-[11px] font-semibold text-slate-600 hover:text-blue-700"><span>未完成项目</span><span id="sidebar-projects-toggle-icon">⌄</span></button>
                    <div class="mt-1 space-y-0.5 pl-2 border-l border-slate-200 ml-2" id="sidebar-projects-list"></div>
                </div>
                <div class="mb-3 border-t border-slate-100 pt-2">
                    <button id="sidebar-assets-toggle" onclick="sidebarAssetsOpen=!sidebarAssetsOpen; renderSidebarProjects()" class="w-full flex items-center justify-between px-2 py-1 text-[11px] font-semibold text-slate-600 hover:text-blue-700"><span>资产清单</span><span id="sidebar-assets-toggle-icon">⌄</span></button>
                    <div id="sidebar-assets-list" class="px-2 mt-1 space-y-0.5"></div>
                </div>
            </div>

            <div class="p-2 border-t border-slate-100 flex items-center justify-between bg-slate-50/50">
                <span class="text-[10px] text-slate-400 sidebar-text">v1.2.1-codex-restored</span>
                <button onclick="toggleSidebar()" class="p-1.5 rounded-md text-slate-500 hover:text-slate-800 hover:bg-slate-200/60 transition-colors" title="收起/展开左侧">
                    <i class="fa-solid fa-angles-left text-xs" id="sidebar-toggle-icon"></i>
                </button>
            </div>
        </aside>

        <!-- CENTER & RIGHT WORKING AREA -->
        <main class="flex-1 flex bg-[#f8fafc] overflow-hidden relative transition-all duration-300 w-full" id="main-working-area">
            
            <!-- Center Stage Canvas -->
            <div class="flex-1 flex flex-col bg-white overflow-hidden relative" id="stage-canvas-container">
                <!-- Populated dynamically by Stage renderers -->
            </div>

            <div id="drawer-backdrop" class="hidden" aria-hidden="true"></div>

            <!-- Right Details Drawer -->
            <aside id="details-drawer" class="hidden w-[min(36vw,480px)] min-w-[360px] bg-white border-l border-slate-200 flex flex-col shrink-0 shadow-sm">
                <div class="p-4 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-full bg-blue-600"></span>
                        <h3 class="font-semibold text-xs text-slate-800 uppercase tracking-wider" id="drawer-title">对象追溯详情</h3>
                    </div>
                    <button onclick="closeDrawer()" class="p-1 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 transition-colors">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>
                <div class="flex-1 overflow-y-auto p-4 space-y-4 text-xs" id="drawer-content">
                    <!-- Populated dynamically -->
                </div>
            </aside>

            <!-- Floating Reopen Drawer Button -->
            <button id="drawer-reopen-btn" onclick="openDrawer('default')" class="hidden absolute right-4 top-4 bg-white border border-slate-200 hover:border-blue-400 text-slate-700 text-xs px-3 py-2 rounded-xl shadow-md z-20 flex items-center space-x-2 transition-all">
                <i class="fa-solid fa-chevron-left text-[10px] text-blue-600"></i>
                <span class="font-medium">详情</span>
            </button>
        </main>
    </div>

    <div id="fullscreen-wireframe-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex flex-col p-6">
        <div class="bg-white rounded-2xl flex-1 flex flex-col overflow-hidden shadow-2xl border border-slate-200">
            <div class="p-4 bg-slate-900 text-white flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-expand text-blue-400"></i>
                    <span class="font-bold text-sm" id="fullscreen-modal-title">全屏原型视图</span>
                </div>
                <button onclick="closeFullscreenModal()" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold">
                    关闭全屏 [ESC]
                </button>
            </div>
            <div class="flex-1 p-6 bg-slate-100 overflow-y-auto flex items-center justify-center" id="fullscreen-modal-body">
                <!-- Live Wireframe Html Injected Here -->
            </div>
        </div>
    </div>

    <div id="gpt-bridge-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-paper-plane text-blue-600"></i>
                    <h3 class="font-bold text-sm text-slate-800">复制给 GPT 与 回调导入</h3>
                </div>
                <button onclick="closeGptBridgeModal()" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            
            <div class="p-5 overflow-y-auto space-y-4 text-xs">
                <!-- Step A: Copy prompt to clipboard -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="font-semibold text-slate-800">1. 复制给 GPT 的完整请求上下文</span>
                        <button onclick="copyGptPromptToClipboard()" class="px-3 py-1 bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100 rounded-lg font-medium transition-colors">
                            <i class="fa-solid fa-copy mr-1"></i> 复制到剪贴板
                        </button>
                    </div>
                    <pre id="modal-gpt-prompt-preview" class="p-3 bg-slate-900 text-slate-200 rounded-xl font-mono text-[11px] whitespace-pre-wrap max-h-40 overflow-y-auto border border-slate-800 leading-relaxed"></pre>
                </div>

                <div class="border-t border-slate-100 pt-3 space-y-2">
                    <div class="font-semibold text-slate-800">2. 粘贴至 GPT 并获取返回 JSON</div>
                    <p class="text-slate-500 text-[11px]">将以上请求发送给 GPT 后，把 GPT 输出的结构化 JSON 粘贴到下方框中导入：</p>
                    <textarea id="modal-json-input" rows="4" class="w-full p-3 border border-slate-200 rounded-xl text-xs font-mono bg-slate-50 outline-none focus:border-blue-500 focus:bg-white transition-all" placeholder="粘贴 GPT 返回的完整 JSON 数据..."></textarea>
                    <div id="gpt-bridge-error" class="text-[11px] text-red-700"></div>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <button onclick="fillSampleGptJson()" class="text-[11px] text-blue-600 hover:underline">
                        <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 填入演示 GPT 回调 JSON
                    </button>
                    <div class="flex items-center space-x-2">
                        <button onclick="markPastedAndSent()" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium transition-colors">
                            我已粘贴并发送 (等待回调)
                        </button>
                        <button onclick="importGptJsonFromModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold shadow-md transition-colors">
                            导入回调 JSON
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Runtime data is loaded from the local MVP service; it is never mocked here.
        const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:3000' : '';
        let runtimeProjects = [];
        let runtimeTasks = [];
        let selectedTaskDetail = null;
        let selectedTaskEvents = [];
        let dashboardData = null;
        let apiConnected = false;
        let apiError = '';
        let refreshInFlight = false;
        let runtimePollTimer = null;
        let staticRuntime = false;
        const viewStagesByTaskId = {};
        const viewNodesByTaskStage = {};
        let selectedAssetContext = null;
        let sidebarSection = 'projects';
        let sidebarProjectsOpen = true;
        let sidebarAssetsOpen = true;
        const sidebarProjectOpenById = {};

        // Global UI state
        let selectedTaskId = null;
        let executionLayerTab = 'progress';
        let runtimeDetailView = 'dag';
        let codexCopyFeedback = '';
        let diagnosisCopyFeedback = '';
        let currentFilterProject = 'all';
        let taskSearchQuery = '';
        let taskStatusFilter = 'all';
        let taskEvidenceFilter = 'all';
        let isSidebarCollapsed = false;
        let isDrawerOpen = false;
        let runDetailsOpen = false;
        const expandedStageNodes = {};

        // Task Creation State Machine
        let isCreatingTask = false;
        let createStep = 'entrances';
        let selectedEntrance = 'new_project';
        let rawRequirementText = '';
        let projectPlatform = 'web_app';
        let deliveryGoal = 'runnable_mvp';
        let projectType = 'new';
        let existingProjectPath = '';
        let referenceFiles = [];
        let createSubmitError = '';
        let createSubmitPending = false;
        let activeDrawerTab = 'document';
        let activeDrawerContext = null;
        let activeDrawerDocumentNodeId = null;
        let modifyInstruction = '';
        let modifySubmitPending = false;
        let modifySubmitMessage = '';
        let modifyTargetNodeId = null;
        let modifyLastResponse = null;
        let modifyScopeExpansion = null;
        let workflowViewMode = 'business';
        let selectedCapabilityAsset = null;
        let logKindFilter = 'all';
        let selectedLogEventId = null;
        const previewChecks = new Map();
        
        // GPT Bridge State
        let bridgeSessionId = '';
        let requestId = '';
        let gptBridgeStatus = 'idle';
        let gptRequestData = null;
        let gptResponseData = null;
        let qaAnswersMap = {};
        let customSupplementText = '';
        let selectedExecutionMode = 'automated';

        // Stage Interactive View States are populated from runtime task artifacts.

        // Shared interaction architecture for Prototype Doc → Interaction Diagram → Interaction Doc
        const interactionArchitecture = {
            frameworks: [
                {
                    id: 'FRAME-COCKPIT',
                    name: '总控任务驾驶舱',
                    modules: [
                        {
                            id: 'MOD-RUNTIME-OVERVIEW',
                            name: '顶部运行概览',
                            tasks: [
                                { id: 'TASK-VIEW-RUNTIME', name: '查看运行状态', states: ['default', 'running', 'blocked', 'risk'] }
                            ]
                        },
                        {
                            id: 'MOD-TASK-LIST',
                            name: '左侧任务列表',
                            tasks: [
                                { id: 'TASK-SWITCH-RUNNING', name: '切换当前运行任务', states: ['default', 'selected'] }
                            ]
                        },
                        {
                            id: 'MOD-FLOW-CANVAS',
                            name: '任务流程画布',
                            tasks: [
                                { id: 'TASK-VIEW-NODE', name: '查看执行节点', states: ['pending', 'running', 'waiting_review', 'blocked', 'completed'] },
                                { id: 'TASK-HANDLE-BLOCK', name: '处理阻塞节点', states: ['blocked', 'reviewing', 'resolved'] }
                            ]
                        },
                        {
                            id: 'MOD-CONTROLLER-REVIEW',
                            name: '总控审核',
                            tasks: [
                                { id: 'TASK-REVIEW-RESULT', name: '总控审核节点结果', states: ['waiting_review', 'approved', 'revision_required', 'rejected'] },
                                { id: 'TASK-CONFIRM-NEXT', name: '确认下一步执行', states: ['waiting_decision', 'continue', 'return_for_revision'] }
                            ]
                        }
                    ]
                }
            ]
        };

        let selectedFrameworkId = 'FRAME-COCKPIT';
        let selectedModuleId = 'MOD-RUNTIME-OVERVIEW';
        let selectedInteractionTaskId = 'TASK-VIEW-RUNTIME';
        let selectedInteractionTaskState = 'default';

        function getSelectedInteractionFramework() {
            return interactionArchitecture.frameworks.find(framework => framework.id === selectedFrameworkId) || interactionArchitecture.frameworks[0];
        }

        function getSelectedInteractionModule() {
            const framework = getSelectedInteractionFramework();
            return framework.modules.find(module => module.id === selectedModuleId) || framework.modules[0];
        }

        function getSelectedInteractionTask() {
            const module = getSelectedInteractionModule();
            return module.tasks.find(task => task.id === selectedInteractionTaskId) || module.tasks[0] || null;
        }

        function getSelectedInteractionTaskState() {
            const task = getSelectedInteractionTask();
            if (!task) return null;
            return task.states.includes(selectedInteractionTaskState) ? selectedInteractionTaskState : task.states[0];
        }

        function addInteractionModule(frameworkId, name) {
            const framework = interactionArchitecture.frameworks.find(item => item.id === frameworkId);
            if (!framework || !name || !name.trim()) return;

            const baseId = Date.now();
            let moduleId = `MOD-${baseId}`;
            let suffix = 1;
            while (framework.modules.some(item => item.id === moduleId)) {
                moduleId = `MOD-${baseId}-${suffix++}`;
            }

            framework.modules.push({
                id: moduleId,
                name: name.trim(),
                tasks: []
            });
            selectedFrameworkId = framework.id;
            selectedModuleId = moduleId;
            selectedInteractionTaskId = null;
            renderMainCanvas();
        }

        function deleteInteractionModule(moduleId) {
            for (const framework of interactionArchitecture.frameworks) {
                const moduleIndex = framework.modules.findIndex(item => item.id === moduleId);
                if (moduleIndex === -1 || framework.modules.length <= 1) continue;

                framework.modules.splice(moduleIndex, 1);
                if (selectedModuleId === moduleId) {
                    selectedFrameworkId = framework.id;
                    selectInteractionModule(framework.modules[0].id);
                } else {
                    renderMainCanvas();
                }
                return;
            }
        }

        function renameInteractionModule(moduleId, newName) {
            const framework = getSelectedInteractionFramework();
            const module = framework.modules.find(item => item.id === moduleId);

            if (!module || !newName || !newName.trim()) return;

            module.name = newName.trim();
            renderMainCanvas();
        }

        function selectInteractionModule(moduleId) {
            const framework = getSelectedInteractionFramework();
            const module = framework.modules.find(item => item.id === moduleId);
            if (!module) return;
            selectedModuleId = module.id;
            selectedInteractionTaskId = module.tasks[0] ? module.tasks[0].id : null;
            selectedInteractionTaskState = module.tasks[0] ? module.tasks[0].states[0] : null;

            renderMainCanvas();
        }

        function selectInteractionTask(taskId) {
            const framework = getSelectedInteractionFramework();
            for (const module of framework.modules) {
                const task = module.tasks.find(item => item.id === taskId);
                if (!task) continue;
                selectedModuleId = module.id;
                selectedInteractionTaskId = task.id;
                selectedInteractionTaskState = task.states[0] || null;
                renderMainCanvas();
                return;
            }
        }

        function selectInteractionTaskState(state) {
            const task = getSelectedInteractionTask();
            if (!task || !task.states.includes(state)) return;
            selectedInteractionTaskState = state;
            renderMainCanvas();
        }

        function renderInteractionWireframeHtml(moduleId) {
            const framework = getSelectedInteractionFramework();
            const module = framework.modules.find(item => item.id === moduleId);
            if (!module) return '';
            if (!module.tasks.length) {
                return `<div class="p-6 bg-slate-50 rounded-xl space-y-4 text-xs"><div class="p-4 bg-white rounded-xl border shadow-xs flex items-center justify-between"><span class="font-bold text-slate-800">${module.name}</span><span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-[10px]">待定义</span></div><div class="p-8 bg-white border border-dashed border-slate-300 rounded-xl text-center text-slate-500">该模块尚未定义交互预览</div></div>`;
            }

            const taskRows = module.tasks.map(task => `<div class="p-3 bg-white border border-slate-200 rounded-lg flex items-center justify-between"><span class="font-medium text-slate-700">${task.name}</span><span class="text-[10px] text-slate-400">${task.states.join(' · ')}</span></div>`).join('');
            const currentState = getSelectedInteractionTaskState() || '未选择';
            return `<div class="p-6 bg-slate-50 rounded-xl space-y-4 text-xs"><div class="p-4 bg-white rounded-xl border shadow-xs flex items-center justify-between"><span class="font-bold text-slate-800">${module.name}</span><span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded text-[10px]">低保真预览</span></div><div class="grid grid-cols-2 gap-3"><div class="p-4 bg-white border border-slate-200 rounded-xl"><span class="block text-slate-400 mb-1">模块概览</span><span class="font-semibold text-slate-800">${module.name}</span></div><div class="p-4 bg-white border border-slate-200 rounded-xl"><span class="block text-slate-400 mb-1">当前 State</span><span class="font-semibold text-blue-700">${currentState}</span></div></div><div class="p-4 bg-white border border-slate-200 rounded-xl space-y-2"><div class="font-semibold text-slate-800">Task / State 列表</div>${taskRows}</div></div>`;
        }

        let activeTestId = 'TC-01';

        // Candidate Main Flow Nodes
        let candidateMainNodes = [];

        // Stage metadata
        const stagesMeta = [
            { id: 'competitor', label: '01 竞品分析' },
            { id: 'requirement', label: '02 需求文档' },
            { id: 'interaction', label: '03 交互设计' },
            { id: 'prototype', label: '04 原型' },
            { id: 'ui_design', label: '05 UI 设计' },
            { id: 'development', label: '06 开发' },
            { id: 'testing', label: '07 测试验收' }
        ];

        // Capability Registry is runtime-owned. Empty/failed registry stays Unknown; no local list is authoritative.
        let capabilityRegistry = { status: 'UNKNOWN', source: 'registry_unavailable', entries: [] };

        window.onload = function() {
            initApp();
        };

        function initApp() {
            closeDrawer();
            document.addEventListener('keydown', event => { if (event.key === 'Escape' && isDrawerOpen) closeDrawer(); });
            renderSidebarProjects();
            updateTopStats();
            renderHeader();
            renderMainCanvas();
            refreshRuntimeData();
            startRuntimePolling();
        }

        function statusLabel(status) {
            return ({ queued: '排队', pending: '未开始', running: '进行中', paused: '已暂停', waiting_review: '等待审核', revision_required: '需要返工', needs_human: '需要人工介入', blocked: '阻塞', completed: '已完成', success: '成功', failed: '失败', canceled: '取消', unknown: 'Unknown', not_run: 'Not Run' }[status] || status || '未知');
        }

        function statusIcon(status) {
            return ({ queued: '◌', pending: '○', running: '●', paused: 'Ⅱ', waiting_review: '◐', blocked: '!', completed: '✓', success: '✓', failed: '!', canceled: '×', unknown: '?' }[status] || '•');
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        async function fetchRuntimeApi(path, options = {}) {
            const response = await fetch(`${API_BASE}${path}`, { ...options, headers: { 'content-type': 'application/json', ...(options.headers || {}) } });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) { const error = new Error(payload.message || payload.error || `HTTP ${response.status}`); error.payload = payload; error.status = response.status; error.endpoint = path; throw error; }
            return payload;
        }

        function applyProjectsPayload(payload) {
            if (!payload || !Array.isArray(payload.projects)) throw new Error('Invalid /api/projects payload: projects must be an array');
            runtimeProjects = payload.projects;
            runtimeTasks = runtimeProjects.flatMap(project => (project.tasks || []).map(task => ({
                ...task, projectId: project.id, project: project.name,
                viewStage: viewStagesByTaskId[task.id] || task.currentStage
            })));
            if (!runtimeTasks.some(task => task.id === selectedTaskId)) selectedTaskId = runtimeTasks[0]?.id || null;
        }

        function detailOrDefaultCapabilityRegistry(payload) {
            if (!payload || payload.status !== 'available' || !Array.isArray(payload.entries)) return { status: 'UNKNOWN', source: payload?.source || 'registry_unavailable', entries: [] };
            return { status: 'AVAILABLE', source: payload.source || 'runtime_registry', entries: payload.entries };
        }

        async function refreshRuntimeData() {
            if (staticRuntime) return;
            if (refreshInFlight) return;
            refreshInFlight = true;
            try {
                const [projectsPayload, dashboardPayload, capabilitiesPayload] = await Promise.all([fetchRuntimeApi('/api/projects'), fetchRuntimeApi('/api/dashboard'), fetchRuntimeApi('/api/capabilities')]);
                applyProjectsPayload(projectsPayload);
                dashboardData = dashboardPayload;
                capabilityRegistry = detailOrDefaultCapabilityRegistry(capabilitiesPayload);
                if (selectedTaskId) {
                    const requestedTaskId = selectedTaskId;
                    const detail = await Promise.all([fetchRuntimeApi(`/api/tasks/${encodeURIComponent(requestedTaskId)}`), fetchRuntimeApi(`/api/tasks/${encodeURIComponent(requestedTaskId)}/events`)]);
                    if (requestedTaskId !== selectedTaskId) return;
                    selectedTaskDetail = detail[0].task || null;
                    selectedTaskEvents = detail[1].events || [];
                    const cached = runtimeTasks.find(task => task.id === selectedTaskId);
                    if (cached && selectedTaskDetail) Object.assign(cached, selectedTaskDetail, { project: cached.project, projectId: cached.projectId, viewStage: viewStagesByTaskId[selectedTaskId] || selectedTaskDetail.currentStage });
                }
                apiConnected = true;
                apiError = '';
            } catch (error) {
                try {
                    const response = await fetch('data.json', { cache: 'no-store' });
                    const payload = await response.json();
                    if (!payload || !Array.isArray(payload.projects)) throw new Error('Invalid static runtime snapshot');
                    applyProjectsPayload({ projects: payload.projects });
                    dashboardData = payload.dashboard || null;
                    capabilityRegistry = detailOrDefaultCapabilityRegistry(payload.capabilities || { status: 'available', entries: [] });
                    const snapshot = payload.tasks?.[selectedTaskId] || Object.values(payload.tasks || {})[0];
                    if (snapshot) {
                        selectedTaskId = snapshot.task?.id || selectedTaskId;
                        selectedTaskDetail = snapshot.task || null;
                        selectedTaskEvents = snapshot.events || [];
                    }
                    staticRuntime = true;
                    apiConnected = true;
                    apiError = '静态演示快照';
                } catch (staticError) {
                    apiConnected = false;
                    apiError = `${error.message} · endpoint ${error.endpoint || 'runtime API'} · static fallback unavailable`;
                    selectedTaskDetail = null;
                    selectedTaskEvents = [];
                }
            } finally {
                refreshInFlight = false;
                renderSidebarProjects();
                updateTopStats();
                renderHeader();
                if (!isCreatingTask) renderMainCanvas();
                if (isDrawerOpen && ['trace', 'log', 'version', 'review'].includes(activeDrawerTab)) renderV5DrawerContent('refresh');
                updatePreviewStatus();
            }
        }

        function startRuntimePolling() {
            if (runtimePollTimer) clearInterval(runtimePollTimer);
            runtimePollTimer = setInterval(refreshRuntimeData, 1500);
        }

        async function startSelectedTask() {

            await refreshRuntimeData();
        }

        async function pauseSelectedTask() {
            if (!selectedTaskId) return;

        }

            catch (error) { apiConnected = false; apiError = error.message; }
            await refreshRuntimeData();
        }

        function humanizeWorker(event) {
            if (!event) return 'Unknown / 尚无当前 Worker 证据';
            const kind = event.kind || event.type || '';
            const id = event.asset_id || event.agent_id || event.worker || '';
            const labels = { agent: 'Agent 执行器', runtime: '本地运行器', harness: 'Harness 执行器', review: '人工审核' };
            return `${labels[kind] || '执行 Worker'}${id ? ` · ${id}` : ''}`;
        }

        function currentWorkerForTask(task) {
            const events = getUnifiedRuntimeEvents(task);
            if (task?.status === 'waiting_review') return '等待总控审核';
            const latest = task?.latest_execution || {};
            if (task?.status === 'completed') {
                const last = events.slice().reverse().find(event => event.kind === 'agent' || event.kind === 'runtime');
                return `当前无运行 Worker / 最近执行者：${last ? humanizeWorker(last) : 'Unknown'}`;
            }
            if (task?.status !== 'running' || latest.finished_at) return '当前无运行 Worker';
            const active = events.slice().reverse().find(event => event.execution_id === latest.execution_id && event.kind !== 'review' && !['finished','completed','exited','exit'].includes(event.action || event.status));
            return active ? humanizeWorker(active) : 'Unknown / 尚无当前 Worker 证据';
        }

        function stageCompletionSummary(task) {
            const count = stagesMeta.filter(stage => getWorkflowStage(task, stage.id)?.status === 'completed').length;
            return `${count} / ${stagesMeta.length}`;
        }

        function renderFinalDelivery(task, artifact) {

            return `<div class="m-5 p-5 rounded-xl border ${shell}"><div class="font-semibold ${full ? 'text-emerald-900' : 'text-amber-900'}">${title} · ${stageCompletionSummary(task)} 阶段完成</div><div class="text-xs mt-1 ${full ? 'text-emerald-800' : 'text-amber-800'}">最后记录位置：${escapeHtml(stageLabel(task.currentStage))} · 阶段完成证据：${stageCompletionSummary(task)} · ${full ? '验收证据可见' : '运行已结束，不代表七个业务阶段全部完成'}</div><div class="grid md:grid-cols-3 gap-3 mt-3"><div class="p-3 rounded-lg bg-white border"><div class="text-[10px] text-slate-400">发生了什么</div><div class="text-xs mt-1">${escapeHtml(task.name || '暂无')} · 实际产物</div></div><div class="p-3 rounded-lg bg-white border"><div class="text-[10px] text-slate-400">证据</div><div class="mt-1">${evidence}</div></div><div class="p-3 rounded-lg bg-white border"><div class="text-[10px] text-slate-400">下一步</div><div class="flex flex-wrap gap-2 mt-1 text-xs"><button onclick="executionLayerTab='detail'; renderMainCanvas()" class="text-indigo-700 hover:underline">查看差异</button><button onclick="copyCodexContext('${escapeHtml(task.id)}',{instruction:'请基于最终交付证据继续。'})" class="text-indigo-700 hover:underline">Open in Codex</button><button onclick="selectedTaskId='${escapeHtml(task.id)}'; renderMainCanvas()" class="text-slate-600 hover:underline">继续此任务</button></div></div></div></div>`;

        function copyCurrentModifyContext(taskId, stageId, cardId, nodeId) {
            const task = runtimeTasks.find(item => item.id === taskId) || currentUiTask();
            const nodes = makeSchemaDocumentNodes(task, stageId, cardId, drawerCardTitle(stageId, cardId));
            const node = nodes.find(item => item.id === nodeId) || nodes.find(item => !item.parent_id) || nodes[0];
            const scope = node ? getNodeWithDescendants(node.id, nodes) : [];
            const previous = getRuntimeEvents(task).slice().reverse().find(event => event.stage_id === stageId && event.kind === 'agent');
            const artifact = stageArtifact(task, stageId, cardId) || task?.artifact || {};
            const context = [`AIOS Modify Context`, `task_id: ${task?.id || 'Unknown'}`, `stage_id: ${stageId || 'Unknown'}`, `node_id: ${node?.id || 'Unknown'}`, `node_path: ${nodePathLabel(nodes, node)}`, `artifact_id: ${artifact.artifact_id || 'Unknown'}`, `version: ${artifact.version || 'Unknown'}`, `fingerprint: ${artifact.fingerprint || 'Unknown'}`, `local_path: ${artifact.local_path || artifact.path || 'Unknown'}`, `current_scope: ${node?.title || 'Unknown'} + descendants`, `scope_node_ids: ${scope.map(item => item.id).join(', ') || 'Unknown'}`, `actual_previous_agent: ${previous ? (previous.asset_id || previous.agent_id || previous.agent || 'Unknown') : 'Unknown / No Agent Event'}`, `modifyInstruction: ${modifyInstruction || 'Unknown / 尚未填写'}`].join('\n');
            return copyTextWithFeedback(context);
        }

        async function copyTextWithFeedback(text, target = 'codex') {
            let copied = false;
            try { if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); copied = true; } } catch (error) { copied = false; }
            if (!copied) { try { const area = document.createElement('textarea'); area.value = text; document.body.appendChild(area); area.select(); copied = document.execCommand('copy') === true; area.remove(); } catch (error) { copied = false; } }
            if (target === 'diagnosis') diagnosisCopyFeedback = copied ? '✓ 已复制诊断给 Codex' : '× 复制失败，请手动复制证据文本'; else codexCopyFeedback = copied ? '✓ 已复制 Codex 上下文' : '× 复制失败，请手动复制证据文本';
            renderMainCanvas();
            setTimeout(() => { if (target === 'diagnosis') diagnosisCopyFeedback = ''; else codexCopyFeedback = ''; renderMainCanvas(); }, 2200);
        }

        function codexContextForTask(task, extra = {}) {
            const artifact = task?.artifact || {};

            const changedFiles = [...new Set(events.flatMap(event => Array.isArray(event.changed_files) ? event.changed_files : []))];
            return [`AIOS Cockpit Context Package`, `Project: ${task?.projectName || task?.project || 'Unknown'} (${task?.projectId || 'Unknown'})`, `Task: ${task?.name || 'Unknown'} (${task?.id || 'Unknown'})`, `Run: ${task?.latest_execution?.execution_id || 'Unknown'}`, `Stage: ${stage}`, `Card/Node: ${context.cardId || 'Unknown'} / ${activeDrawerDocumentNodeId || modifyTargetNodeId || 'Unknown'}`, `Status: ${task?.status || 'Unknown'}`, `Worker: ${currentWorkerForTask(task)}`, `Runtime Event IDs: ${events.map(event => event.event_id || 'Unknown').join(', ') || 'Unknown'}`, `Plan: ${JSON.stringify(task?.capability_plan || 'Unknown')}`, `Registry: ${JSON.stringify(task?.capability_registry || capabilityRegistry || 'Unknown')}`, `Unknown blockers: ${unknown.join(' | ') || 'None evidenced'}`, `Evidence paths: ${artifact.content_url || artifact.local_path || artifact.path || 'Unknown'}`, `Artifact: ${artifact.artifact_id || 'Unknown'} | exists=${artifact.exists == null ? 'Unknown' : artifact.exists} | version=${artifact.version || 'Unknown'} | fingerprint=${artifact.fingerprint || artifact.hash || 'Unknown'}`, `Changed Files: ${changedFiles.join(', ') || 'Unknown'}`, `Key logs: ${events.slice(-5).map(event => event.message || event.action || 'Unknown').join(' | ') || 'Unknown'}`, `Next instruction: ${extra.instruction || modifyInstruction || '请基于当前证据继续处理任务。'}`].join('\\n');
        }

        function copyCodexContext(taskId = selectedTaskId, extra = {}) { const task = runtimeTasks.find(item => item.id === taskId) || currentUiTask(); return copyTextWithFeedback(codexContextForTask(task, extra)); }

        function renderDiagnosisView(task) {

        function renderAssetArchitecture(container) {

        async function copyGptPromptToClipboard() {
            const text = buildGptPromptText();
            let copied = false;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    copied = true;
                }
            } catch (error) {
                copied = false;
            }
            if (!copied) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.setAttribute('readonly', '');
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                copied = document.execCommand('copy');
                document.body.removeChild(textarea);
            }
            const buttons = Array.from(document.querySelectorAll('button[onclick="copyGptPromptToClipboard()"]'));
            buttons.forEach(button => {
                if (!button.dataset.copyLabel) button.dataset.copyLabel = button.textContent.trim();
                button.textContent = copied ? '已复制' : '复制失败';
                button.classList.toggle('text-emerald-600', copied);
                button.classList.toggle('text-red-600', !copied);
            });
            window.setTimeout(() => buttons.forEach(button => {
                button.textContent = button.dataset.copyLabel || '复制';
                button.classList.remove('text-emerald-600', 'text-red-600');
            }), 1600);
        }

                }).join('') || '<div class="p-6 border border-dashed border-slate-300 rounded-xl text-xs text-slate-500">Unknown / 尚无真实项目扫描结果</div>';
                return `<div class="flex-1 flex flex-col p-8 overflow-y-auto max-w-5xl mx-auto w-full space-y-6"><div class="flex items-center justify-between border-b pb-4"><div><span class="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded border border-indigo-200 font-semibold">入口 02: 继续项目</span><h2 class="text-base font-bold text-slate-900 mt-2">真实项目与产物证据审查</h2><p class="text-xs text-slate-500 mt-0.5">只展示 Runtime API 返回的项目、任务和磁盘文件；没有证据就显示 Unknown。</p></div><button onclick="createStep = 'entrances'; renderMainCanvas();" class="text-xs text-slate-500 hover:text-slate-800 font-medium">← 返回入口</button></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">${projectCards}</div></div>`;

        function renderWorkflowHeader() {
            const currentTask = runtimeTasks.find(t => t.id === selectedTaskId);
            const barContainer = document.getElementById('workspace-stage-nav');
            if (!barContainer || !currentTask) return;
            barContainer.innerHTML = '';
            const currentViewStage = viewStagesByTaskId[currentTask.id] || currentTask.currentStage;
            stagesMeta.forEach((stage, idx) => {
                const isRealCurrent = currentTask.currentStage === stage.id;
                const isViewing = currentViewStage === stage.id;
                const stageRealStatus = getWorkflowStage(currentTask, stage.id)?.status || 'unknown';
                let borderColor = 'border-slate-200 bg-white text-slate-600';
                let iconSymbol = '○';
                if (stageRealStatus === 'completed') { borderColor = 'border-blue-300 bg-blue-50 text-blue-700'; iconSymbol = '✓'; }
                else if (stageRealStatus === 'running' && isRealCurrent && currentTask.status === 'running') { borderColor = 'border-blue-400 bg-blue-600 text-white shadow-xs font-semibold'; iconSymbol = '●'; }
                else if (stageRealStatus === 'waiting_review') { borderColor = 'border-amber-300 bg-amber-50 text-amber-700'; iconSymbol = '◷'; }
                else if (stageRealStatus === 'paused') { borderColor = 'border-amber-300 bg-amber-50 text-amber-700'; iconSymbol = 'Ⅱ'; }
                else if (stageRealStatus === 'blocked') { borderColor = 'border-red-300 bg-red-50 text-red-700'; iconSymbol = '!'; }
                else if (stageRealStatus === 'failed') { borderColor = 'border-red-300 bg-red-50 text-red-700'; iconSymbol = '×'; }
                if (isViewing) borderColor += ' ring-2 ring-blue-300 ring-offset-1';
                const stageItem = document.createElement('div');
                stageItem.className = `flex items-center space-x-1 cursor-pointer px-2 py-1.5 rounded-lg border transition-all ${borderColor} text-[11px] shrink-0 min-w-24`;
                stageItem.onclick = () => { viewStagesByTaskId[currentTask.id] = stage.id; renderMainCanvas(); closeDrawer(); };
                stageItem.innerHTML = `<span class="font-bold text-[11px]">${iconSymbol}</span><span><span class="block font-semibold">${stage.label}</span><span class="block text-[10px] opacity-75">${statusLabel(stageRealStatus)}</span></span>`;
                barContainer.appendChild(stageItem);
                if (idx < stagesMeta.length - 1) { const arrow = document.createElement('i'); arrow.className = 'fa-solid fa-arrow-right text-[9px] text-slate-300 px-0.5 shrink-0'; barContainer.appendChild(arrow); }
            });
        }

        function renderMainCanvas() {

            if (!apiConnected) {

            }
            const currentTask = runtimeTasks.find(t => t.id === selectedTaskId);
            if (!currentTask) { container.innerHTML = '<div class="p-8 text-slate-400 text-xs">暂无本地任务</div>'; return; }
            currentTask.viewStage = viewStagesByTaskId[currentTask.id] || currentTask.currentStage || 'unknown';
            const viewStageMeta = stagesMeta.find(s => s.id === currentTask.viewStage) || { id: 'unknown', label: 'Unknown' };
            const realStageMeta = stagesMeta.find(s => s.id === currentTask.currentStage) || { id: 'unknown', label: 'Unknown' };
            const detail = selectedTaskDetail?.id === currentTask.id ? selectedTaskDetail : currentTask;
            const artifact = detail.artifact || {};
            const action = detail.status === 'pending' ? '<button onclick="startSelectedTask()" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-semibold">开始运行</button>' : detail.status === 'paused' ? '<button onclick="startSelectedTask()" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-semibold">继续运行</button>' : detail.status === 'waiting_review' ? '<button onclick="reviewSelectedTask(\'approve\')" class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-semibold">触发总控审核</button>' : detail.status === 'running' ? '<button onclick="pauseSelectedTask()" class="px-3 py-1.5 rounded-lg bg-amber-600 text-white text-xs font-semibold">暂停</button>' : detail.status === 'completed' ? '<span class="text-xs text-emerald-700 font-semibold">已完成</span>' : detail.status === 'failed' ? '<button onclick="startSelectedTask()" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-semibold">重新运行</button>' : '';
            const nodeHtml = (detail.nodes || []).map(node => `<div class="flex items-center justify-between text-xs"><span>${escapeHtml(node.name)}</span><span class="font-semibold">${statusLabel(node.status)}</span></div>`).join('') || '<div class="text-xs text-slate-400">暂无节点</div>';
            const eventHtml = getUnifiedRuntimeEvents(detail).slice(-12).map(event => `<div class="font-mono text-[10px] text-slate-600"><span class="text-slate-400">${escapeHtml(event.at || '')}</span> [${escapeHtml(event.stream || event.type || 'system')}] ${escapeHtml(event.message || '')}</div>`).join('') || '<div class="text-xs text-slate-400">暂无运行日志</div>';
            const latestExecution = detail.latest_execution || {};

            const runHeader = `<div class="px-6 py-2 border-b border-slate-100 bg-slate-50 grid grid-cols-2 md:grid-cols-6 gap-2 text-[10px]"><div><span class="text-slate-400">Run ID</span><div class="font-mono text-slate-700 mt-1">${escapeHtml(latestExecution.execution_id || 'Unknown')}</div></div><div><span class="text-slate-400">运行模式</span><div class="text-slate-700 mt-1">${escapeHtml(detail.executionMode || 'Unknown')}</div></div><div><span class="text-slate-400">开始时间</span><div class="text-slate-700 mt-1">${escapeHtml(latestExecution.started_at || 'Unknown')}</div></div><div><span class="text-slate-400">最近事件</span><div class="text-slate-700 mt-1 truncate" title="${escapeHtml(recentEvent?.message || '')}">${escapeHtml(recentEvent?.action || recentEvent?.message || 'Unknown')}</div></div><div><span class="text-slate-400">耗时 / ETA</span><div class="text-slate-700 mt-1">${escapeHtml(latestExecution.finished_at ? '已结束' : detail.status === 'running' ? '运行中 / ETA Unknown' : 'Unknown')}</div></div><div class="flex items-end gap-1">${detail.status === 'running' ? '<button onclick="pauseSelectedTask()" class="px-2 py-1 rounded border border-amber-200 text-amber-700">暂停</button>' : ''}${detail.status === 'paused' ? '<button onclick="startSelectedTask()" class="px-2 py-1 rounded border border-blue-200 text-blue-700">继续运行</button>' : ''}${detail.status === 'failed' ? '<button onclick="startSelectedTask()" class="px-2 py-1 rounded border border-blue-200 text-blue-700">重试</button>' : ''}${detail.status === 'waiting_review' ? '<button onclick="reviewSelectedTask(\'approve\')" class="px-2 py-1 rounded border border-emerald-200 text-emerald-700">继续审核</button>' : ''}</div></div>`;
            const runDetails = `<details ${runDetailsOpen ? 'open' : ''} ontoggle="runDetailsOpen = this.open" class="border-t border-slate-200 bg-white"><summary class="cursor-pointer px-6 py-3 text-xs font-semibold text-slate-600">Run Details · 运行详情</summary>${runHeader}<div class="px-6 py-3 text-[10px] text-slate-500 whitespace-pre-wrap">stdout / stderr：${escapeHtml(eventHtml || 'Unknown')}</div></details>`;
            const stageContext = viewStageMeta.id !== realStageMeta.id ? `<div class="mx-6 mt-2 px-3 py-2 rounded-lg bg-blue-50 border border-blue-100 text-xs text-blue-900">正在查看：<strong>${viewStageMeta.label}</strong> · ${detail.status === 'completed' ? '最后记录位置' : '当前阶段'}：<strong>${realStageMeta.label}</strong></div>` : '';
            const progressBody = `<div class="flex-1 flex flex-col overflow-hidden relative">${stageContext}${renderV1StageView(currentTask.viewStage, currentTask, {showGraph:false})}${runDetails}</div>`;
            const detailBody = `<div class="flex-1 overflow-y-auto p-6 space-y-4"><div class="p-4 rounded-xl border"><div class="font-semibold text-sm">AI 执行详情</div><div class="text-xs text-slate-500 mt-1">当前 Worker：${escapeHtml(currentWorkerForTask(detail))}</div><div class="mt-3">${nodeHtml}</div></div><details class="p-4 rounded-xl border"><summary class="cursor-pointer text-xs font-semibold">查看运行详情（stdout / stderr）</summary><div class="mt-3 space-y-1">${eventHtml}</div></details>${renderRuntimeDetailView(currentTask)}</div>`;
            const humanStageState = detail.status === 'completed' ? `已结束 · 最后停在「${realStageMeta.label}」` : detail.status === 'waiting_review' ? `等待总控审核 · 「${realStageMeta.label}」` : detail.status === 'running' ? `正在进行 · 当前在「${realStageMeta.label}」` : detail.status === 'paused' ? `已暂停 · 停在「${realStageMeta.label}」` : detail.status === 'failed' || detail.status === 'blocked' ? `遇到问题 · 「${realStageMeta.label}」` : `尚未开始 · 「${realStageMeta.label}」`;
            container.innerHTML = `<div class="px-6 py-1.5 border-b border-slate-100 flex items-center justify-between bg-white"><div class="flex items-center gap-3"><div class="font-semibold text-sm text-slate-800">${escapeHtml(currentTask.project || '暂无项目')}</div><div class="text-[11px] text-slate-500">${humanStageState}</div></div>${action}</div>${executionLayerTab==='progress' ? renderCurrentWorkSummary(detail) : ''}<div id="workspace-stage-nav" class="flex flex-wrap items-center gap-1 px-6 py-1.5"></div>${executionLayerTab==='diagnosis' ? renderDiagnosisView(detail) : executionLayerTab==='detail' ? detailBody : progressBody}`;
            renderWorkflowHeader();

        function getWorkflowStage(task, stageId) {
            const stages = task?.workflow?.stages;
            if (Array.isArray(stages)) return stages.find(stage => stage.id === stageId) || null;
            if (stages && typeof stages === 'object') return stages[stageId] || null;
            if (task?.stages && typeof task.stages === 'object' && task.stages[stageId]) return { id: stageId, status: task.stages[stageId], cards: [] };
            return null;
        }

        function workflowCardStatus(task, stageId, cardId) {
            const stage = getWorkflowStage(task, stageId);
            const card = stage?.cards?.find?.(item => item.id === cardId);
            return card?.status || stage?.status || 'unknown';
        }

        function workflowStatusLabel(status) {
            return ({ pending: '排队', running: '进行中', waiting_review: '等待审核', blocked: '阻塞', completed: '已完成', failed: '失败', canceled: '取消', unknown: 'Unknown', not_run: 'Not Run' }[status] || 'Unknown');
        }

        function workflowStatusClass(status) {
            return ({ completed: 'text-blue-700 bg-blue-50 border-blue-300', running: 'text-blue-700 bg-blue-50 border-blue-200', waiting_review: 'text-amber-700 bg-amber-50 border-amber-200', blocked: 'text-red-700 bg-red-50 border-red-200', failed: 'text-red-700 bg-red-50 border-red-200' }[status] || 'text-slate-500 bg-slate-50 border-slate-200');
        }

        function renderFlowModeSummary(stageId, task) {
            const events = capabilityEvents(task).filter(event => !event.stage_id || event.stage_id === stageId);
            if (workflowViewMode === 'business') return '<div class="text-[11px] text-slate-500">Business：显示真实 7 阶段与当前任务产物状态。</div>';
            if (workflowViewMode === 'capability') return `<div class="text-[11px] text-indigo-700">Capability：${events.length ? events.map(event => `${escapeHtml(event.kind)}:${escapeHtml(event.asset_id)} · ${escapeHtml(event.action || event.type || 'event')}`).join(' · ') : 'Unknown / 当前阶段没有真实 Capability Event'}</div>`;
            return `<div class="text-[11px] text-slate-600">Combined：Business 阶段 + 真实 Capability Badge。${events.length ? `当前阶段 ${events.length} 个能力事件` : '当前阶段能力事件 Unknown'}</div>`;
        }

        function graphStageStatus(task, stage) {
            const data = getWorkflowStage(task, stage.id);
            const status = data?.status || 'unknown';
            return { status, current: task.currentStage === stage.id, viewing: (task.viewStage || task.currentStage) === stage.id };
        }
        function renderBusinessGraph(task, stageId) {
            const flow = stagesMeta.map((stage, index) => {
                const state = graphStageStatus(task, stage);
                const label = workflowStatusLabel(state.status);
                const current = state.current ? '<span class="text-[10px] text-blue-700">CURRENT</span>' : '';

            const demoReady = Boolean(apiConnected && demoArtifact.exists && demoArtifact.preview_url);
            const demoLive = Boolean(previewCheck?.status === 'HTTP_OK' && previewCheck?.rendered);
            const demoBody = `<div class="space-y-3"><div class="p-4 rounded-xl border ${demoLive ? 'border-emerald-200 bg-emerald-50/50' : 'border-slate-200 bg-slate-50'}"><div class="font-semibold text-slate-800">真实低保真演示 · ${escapeHtml(title)}</div><div class="mt-2 text-xs text-slate-600">${demoArtifact.exists ? `真实 Artifact：${escapeHtml(demoArtifact.path || '')}` : 'Unknown / 尚无真实演示产物'}</div><span data-preview-status="${escapeHtml(demoArtifact.preview_url || '')}" class="inline-block mt-3 px-2 py-1 rounded border text-[10px] ${demoLive?'text-emerald-700 bg-white border-emerald-200':'text-slate-500 bg-white border-slate-200'}">${!demoReady ? 'UNKNOWN / 尚无可访问预览' : demoLive ? 'LIVE · Low-Fi / 真实 API 演示' : 'CHECKING / 等待请求与页面渲染'}</span>${demoReady ? `<iframe title="${escapeHtml(title)} preview" data-preview-url="${escapeHtml(demoArtifact.preview_url)}" onload="previewFrameLoaded(this)" onerror="previewChecks.set(this.dataset.previewUrl,{status:'BROKEN',rendered:false}); updatePreviewStatus()" src="${escapeHtml(demoArtifact.preview_url)}" class="mt-3 w-full h-64 rounded-lg border border-slate-200 bg-white"></iframe><button onclick="window.open('${escapeHtml(demoArtifact.preview_url)}','_blank','noopener')" class="block mt-3 px-3 py-1.5 rounded-lg bg-blue-600 text-white text-[11px]">打开真实预览</button>` : ''}</div><div class="text-xs text-slate-500">LIVE 需要真实文件存在、同源 API 可访问、响应是 HTML 且 iframe 已加载；否则保留 Unknown / Checking。</div></div>`;
            const traceBody = `<div class="space-y-3"><div class="p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-600">调用链与 Log 共用 Runtime Events；Registry 计划不会冒充 Used。</div>${renderDrawerTraceBody(task, context)}</div>`;
            const logBody = `<div class="space-y-3"><div class="text-[10px] uppercase tracking-wider text-slate-400">真实 Runtime Log</div>${renderDrawerLogBody(task, context)}</div>`;
            const snapshots = task.artifact_snapshots || task.versions || [];
            const versionBody = `<div class="space-y-3">${snapshots.length ? snapshots.map(snapshot=>`<div class="p-3 border border-slate-200 rounded-xl"><div class="font-semibold">${escapeHtml(snapshot.snapshot_id || snapshot.version || 'Unknown')}</div><div class="text-[10px] text-slate-500">${escapeHtml(snapshot.created_at || snapshot.timestamp || 'Unknown')} · ${escapeHtml(snapshot.status || 'Unknown')} · producer ${escapeHtml(snapshot.producer || 'Unknown')}</div><div class="text-[10px] text-slate-500 break-all mt-1">path ${escapeHtml(snapshot.path || 'Unknown')} · hash ${escapeHtml(snapshot.hash || snapshot.fingerprint || 'Unknown')}</div><div class="text-[10px] text-slate-500 mt-1">review ${escapeHtml(snapshot.review_decision || (snapshot.review ? JSON.stringify(snapshot.review) : 'Unknown / 尚无 Review 证据'))} · reviewer ${escapeHtml(snapshot.reviewer || 'Unknown')} · expert ${escapeHtml(snapshot.expert_verdict || snapshot.experts || 'Unknown')} · controller ${escapeHtml(snapshot.controller_verdict || snapshot.controller || 'Unknown')}</div></div>`).join('') : '<div class="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-500">Unknown / 尚无版本快照证据</div>'}<div class="p-3 rounded-xl border border-amber-200 bg-amber-50 text-[11px] text-amber-800">Change Request → V2：${escapeHtml((task.change_requests || []).length ? '已记录请求，尚无 Worker 版本产出' : 'Unknown / 尚无请求')} · Audit / Research：Unknown / 尚无真实证据</div></div>`;
            const controllerReview = task.controller_review || {};
            const reviewArtifact = resolveArtifactEvidence(task, context.stageId, context.cardId);
            const reviewBody = `<div class="space-y-3"><div class="p-3 border border-slate-200 rounded-xl"><div class="font-semibold text-slate-700">Expert Review</div><div class="text-xs text-slate-500 mt-1">${escapeHtml(task.reviews?.expert || 'Unknown / 尚无专家审阅证据')}</div></div><div class="p-3 border border-slate-200 rounded-xl"><div class="font-semibold text-slate-700">Controller Review</div><div class="text-xs text-slate-500 mt-1">${escapeHtml(task.reviews?.controller || 'Unknown / 尚无总控决策证据')}</div><div class="grid grid-cols-2 gap-2 mt-2 text-[11px]"><div>Controller ID：${escapeHtml(controllerReview.controller_agent_id || controllerReview.agent_id || task.reviewer || 'Unknown')}</div><div>Decision：${escapeHtml(controllerReview.decision || task.decision || 'Not Run')}</div><div>review_round：${escapeHtml(controllerReview.review_round ?? task.review_round ?? 'Unknown')}</div><div>max_review_rounds：${escapeHtml(controllerReview.max_review_rounds ?? task.max_review_rounds ?? 'Unknown')}</div></div></div><div class="p-3 border border-slate-200 rounded-xl"><div class="font-semibold text-slate-700">Runtime Review Record</div><div class="text-xs text-slate-500 mt-1">${escapeHtml(task.reviewer || 'Unknown')} · ${escapeHtml(task.decision || 'Not Run')}</div>${renderArtifactEvidenceSummary(reviewArtifact)}</div></div>`;
            const route = modifyRouteForStage(context.stageId, task);
            const modifyWorkerAvailable = Boolean(route.agent && !String(route.agent).startsWith('Unknown'));
            const modifyScope = modifyNode ? getNodeWithDescendants(modifyNode.id, nodes) : [];
            const modifyScopeLabel = modifyNode ? `${modifyNode.title} + descendants` : 'Unknown / 尚无范围证据';
            const excludedNodes = nodes.filter(node => !modifyScope.some(item => item.id === node.id)).slice(0, 5).map(node => `<div class="text-[11px] text-slate-500">× ${escapeHtml(node.title)}</div>`).join('') || '<div class="text-[11px] text-slate-500">× 相邻节点未定义</div>';
            const previousTrace = getRuntimeEvents(task).filter(event => event.stage_id === context.stageId).slice(-4);
            const traceLabel = previousTrace.length ? previousTrace.map(event => event.agent_id || event.agent || event.producer || event.action || 'Trace event').join(' → ') : 'Unknown / 尚无真实执行链证据';
            const modifyStatus = modifySubmitPending ? '<div class="text-[11px] text-blue-700">正在提交修改请求…</div>' : (modifySubmitMessage ? `<div class="text-[11px] ${modifySubmitMessage.includes('失败') || modifySubmitMessage.includes('请输入') ? 'text-red-700' : 'text-emerald-700'}">${escapeHtml(modifySubmitMessage)}</div>` : '');
            const modifyBody = `<div class="space-y-3"><div class="p-3 bg-blue-50 border border-blue-200 rounded-xl"><div class="text-[10px] uppercase tracking-wider text-blue-600">MODIFY CONTEXT</div><div class="font-semibold text-blue-900 mt-1">修改：${escapeHtml(nodePathLabel(nodes, modifyNode))}</div><div class="text-[11px] text-blue-800 mt-1">Task：${escapeHtml(task.name || task.id || 'Unknown')} · Stage：${escapeHtml(stageLabel(context.stageId))}</div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-2"><div class="p-3 rounded-xl border border-slate-200"><div class="text-[10px] text-slate-400">本次允许修改</div><div class="mt-1 font-semibold text-slate-800">${escapeHtml(modifyScopeLabel)}</div><div class="mt-2 space-y-0.5">${modifyScope.map(node => `<div class="text-[11px] text-emerald-700">✓ ${escapeHtml(node.title)}</div>`).join('') || '<div class="text-[11px] text-slate-500">Unknown / 尚无范围证据</div>'}</div></div><div class="p-3 rounded-xl border border-slate-200"><div class="text-[10px] text-slate-400">不包含</div><div class="mt-1 space-y-0.5">${excludedNodes}</div></div></div><div class="p-3 rounded-xl border border-slate-200 space-y-1"><div class="flex items-center justify-between"><span class="text-[10px] text-slate-400">执行 Agent</span><span class="font-semibold text-slate-800">${modifyWorkerAvailable ? `Primary Worker：${escapeHtml(route.primary_worker || route.agent)}` : '自动修改 Worker 尚未接入'}<br><span class="text-[10px] font-normal text-slate-500">Supporting Expert：${escapeHtml(route.supporting_expert || 'Unknown')}</span></span></div><div class="text-[11px] text-slate-500">路由依据：${escapeHtml(route.reason)}</div><div class="text-[11px] text-slate-500">Registry：${escapeHtml(route.registry)} · 来源：${escapeHtml(route.source)}</div><details class="mt-2"><summary class="cursor-pointer text-blue-600 text-[11px]">为什么？</summary><div class="mt-2 p-2 rounded bg-slate-50 text-[11px] text-slate-600">当前阶段：${escapeHtml(stageLabel(context.stageId))}<br>当前节点类型：${escapeHtml(modifyNode?.node_type || 'section')}<br>Primary Worker：${escapeHtml(route.primary_worker || route.agent)}<br>Supporting Expert：${escapeHtml(route.supporting_expert || 'Unknown')}<br>上一次实际执行：${escapeHtml(traceLabel)}<br>因此默认继续使用：${escapeHtml(route.agent)}</div></details></div><div class="p-3 rounded-xl border border-slate-200 space-y-1"><div class="text-[10px] text-slate-400">当前版本 / 本地产物</div><div class="text-[11px] text-slate-700">Artifact ID：${escapeHtml(task.artifact?.artifact_id || 'Unknown / 尚无 Artifact ID')}</div><div class="text-[11px] text-slate-700">版本：${escapeHtml(task.artifact?.version || 'Unknown / 尚无版本证据')}</div><div class="text-[11px] text-slate-700">Fingerprint：${escapeHtml(task.artifact?.fingerprint || 'Unknown / 尚未记录 fingerprint')}</div><div class="text-[11px] text-slate-700 break-all">Local Path：${escapeHtml(task.artifact?.local_path || task.artifact?.path || 'Unknown / 尚无本地产物')}</div><div class="text-[11px] text-slate-500 mt-1">上一次执行链：${escapeHtml(traceLabel)}</div></div><div class="flex gap-2"><button onclick="copyCurrentModifyContext('${escapeHtml(task.id)}','${escapeHtml(context.stageId)}','${escapeHtml(context.cardId)}','${escapeHtml(modifyNode?.id || '')}')" class="px-2 py-1 rounded border border-indigo-200 text-indigo-700 text-[11px]">复制修改上下文给 Codex</button></div><label class="block text-[11px] font-semibold text-slate-700">你想怎么修改？<textarea id="modify-instruction" oninput="modifyInstruction=this.value" class="mt-1 w-full min-h-28 rounded-xl border border-slate-300 p-3 text-xs outline-none focus:border-blue-500" placeholder="只输入修改要求，不需要填写 Agent、路径或版本">${escapeHtml(modifyInstruction)}</textarea></label>${modifyStatus}<div class="flex justify-end gap-2"><button onclick="activeDrawerTab='details'; modifySubmitMessage=''; renderV5DrawerContent('${escapeHtml(itemId)}')" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs text-slate-600">取消</button>${modifyScopeExpansion ? `<button onclick="modifyScopeExpansion=null; submitModifyRequest(true)" class="px-3 py-1.5 rounded-lg bg-amber-600 text-white text-xs font-semibold">扩大范围并继续</button>` : ''}<button onclick="submitModifyRequest(false)" ${modifySubmitPending ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-semibold disabled:bg-slate-300">提交修改</button></div></div>`;
            const inspectorBody = `<div class="space-y-3"><div class="p-3 rounded-xl border border-blue-200 bg-blue-50"><div class="text-[10px] uppercase tracking-wider text-blue-600">CONTEXT INSPECTOR</div><div class="font-semibold text-blue-900 mt-1">${escapeHtml(selectedNode?.title || title)}</div><div class="text-[11px] text-blue-800 mt-1">${escapeHtml(stageLabel(context.stageId))} · ${escapeHtml(selectedNode?.node_type || 'object')}</div></div><div class="p-3 rounded-xl border border-slate-200 space-y-1"><div class="text-[10px] text-slate-400">状态</div><div class="text-xs text-slate-700">${escapeHtml(statusLabel(task.status || 'unknown'))}</div><div class="text-[10px] text-slate-400 mt-2">真实 Artifact</div><div class="mt-1">${renderArtifactEvidenceSummary(scopedArtifact)}</div><div class="text-[10px] text-slate-400 mt-2">Review</div><div class="text-[11px] text-slate-700">${escapeHtml(task.reviews?.controller || task.decision || 'Unknown / 尚无 Review 证据')}</div></div>${scopedBody}</div>`;
            const runBody = `<div class="space-y-3"><div class="p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs text-slate-600">调用链、Log、Runtime 和 Worker 统一放在运行面板中。</div>${traceBody}${logBody}</div>`;
            const bodies = { details: inspectorBody, run: runBody, document: inspectorBody, demo: inspectorBody, trace: runBody, log: runBody, version: versionBody, review: reviewBody, modify: modifyBody };
            const objectSummary = `<div class="p-3 rounded-xl border border-slate-200 bg-slate-50"><div class="font-semibold text-slate-800">对象摘要</div><div class="mt-1 text-[11px] text-slate-600">${escapeHtml(task.name || task.id || 'Unknown')} · ${escapeHtml(statusLabel(task.status))} · Stage ${escapeHtml(stageLabel(context.stageId))}</div><div class="text-[11px] text-slate-500 mt-1">当前 Worker：${escapeHtml(currentWorkerForTask(task))} · Artifact：${escapeHtml(task.artifact?.artifact_id || 'Unknown')}</div></div>`;
            contentEl.innerHTML = `<div class="space-y-4 text-xs">${objectSummary}<div class="flex flex-wrap gap-1 border-b border-slate-200 pb-2">${tabHtml}${modifyAction}</div>${bodies[activeDrawerTab] || documentBody}</div>`;
        }

        async function submitModifyRequest(scopeConfirmation = false) {
            const task = currentUiTask();
            modifyInstruction = document.getElementById('modify-instruction')?.value.trim() || modifyInstruction.trim();
            if (!modifyInstruction) { modifySubmitMessage = '请输入修改要求。'; activeDrawerTab = 'modify'; renderV5DrawerContent('modify'); return; }
            const context = activeDrawerContext || { stageId: task.viewStage || task.currentStage || 'competitor', cardId: 'raw-input' };
            const nodes = makeSchemaDocumentNodes(task, context.stageId, context.cardId, drawerCardTitle(context.stageId, context.cardId));
            const targetNode = nodes.find(node => node.id === modifyTargetNodeId) || nodes.find(node => !node.parent_id) || nodes[0];
            const scopeNodes = targetNode ? getNodeWithDescendants(targetNode.id, nodes) : [];
            modifySubmitPending = true; modifySubmitMessage = ''; renderV5DrawerContent('modify');
            try {
                const result = await fetchRuntimeApi('/api/modify', { method: 'POST', body: JSON.stringify({
                    task_id: task.id,
                    stage_id: context.stageId,
                    node_id: targetNode?.id || context.cardId,
                    artifact_id: task.artifact?.artifact_id || null,
                    base_version: task.artifact?.version || null,
                    base_fingerprint: task.artifact?.fingerprint || null,
                    scope_confirmation: scopeConfirmation,
                    page_id: context.stageId === 'prototype' ? 'project-detail' : null,
                    module_id: targetNode?.title || context.cardId,
                    scope_node_id: targetNode?.id || context.cardId,
                    scope_node_ids: scopeNodes.map(node => node.id),
                    instruction: modifyInstruction
                }) });
                modifyLastResponse = result.change_request || null;
                modifySubmitMessage = `${result.message || '修改请求已提交'} · ${result.change_request?.change_request_id || ''}`;
            } catch (error) { const payload = error.payload || {}; if (payload.status === 'waiting_scope_confirmation') modifyScopeExpansion = payload; modifySubmitMessage = payload.status === 'waiting_scope_confirmation' ? `此次修改超出了当前范围；当前允许：${(payload.current_scope || []).join(', ') || 'Unknown'}；新增影响：${(payload.additional_nodes || []).join(', ') || 'Unknown'}；请明确确认后继续。` : `修改请求失败：${error.message}`; }
            modifySubmitPending = false; activeDrawerTab = 'modify'; renderV5DrawerContent('modify');
        }

        function openDrawer(itemId) {
            isDrawerOpen = true;
            const drawer = document.getElementById('details-drawer');
            const reopenBtn = document.getElementById('drawer-reopen-btn');
            const backdrop = document.getElementById('drawer-backdrop');
            drawer.classList.remove('hidden');
            reopenBtn.classList.add('hidden');
            backdrop?.classList.add('hidden');
            renderV5DrawerContent(itemId);
        }

        function closeDrawer() {
            isDrawerOpen = false;
            const drawer = document.getElementById('details-drawer');
            const reopenBtn = document.getElementById('drawer-reopen-btn');
            const backdrop = document.getElementById('drawer-backdrop');
            drawer.classList.add('hidden');
            reopenBtn.classList.remove('hidden');
            backdrop?.classList.add('hidden');
        }

        function renderDrawerContent(itemId) {
            const titleEl = document.getElementById('drawer-title');
            const contentEl = document.getElementById('drawer-content');
            const task = currentUiTask();
            titleEl.innerText = `对象追溯详情 [${itemId}]`;
            contentEl.innerHTML = `<div class="space-y-4 text-xs"><div class="p-3 bg-slate-50 border border-slate-200 rounded-xl"><div class="font-bold font-mono">${escapeHtml(itemId)}</div><div class="text-[11px] text-slate-500 mt-1">Task：${escapeHtml(task?.id || 'Unknown')} · Stage：${escapeHtml(task?.currentStage || 'Global/Unknown stage')}</div></div><div class="p-3 bg-slate-100 border border-slate-200 rounded-lg"><div class="font-bold text-slate-700">Unknown / 尚无 Runtime 证据</div><div class="text-[11px] text-slate-500 mt-1">旧版静态追踪样例已隔离；当前只显示 Runtime API 返回的事件、Artifact 和证据。</div></div><button onclick="executionLayerTab='detail'; runtimeDetailView='trace'; renderMainCanvas()" class="px-3 py-1.5 rounded-lg border border-indigo-200 text-indigo-700">打开真实 Trace</button></div>`;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const icon = document.getElementById('sidebar-toggle-icon');
            const textElements = document.querySelectorAll('.sidebar-text');

            isSidebarCollapsed = !isSidebarCollapsed;

            if (isSidebarCollapsed) {
                sidebar.classList.remove('w-[216px]');
                sidebar.classList.add('w-16');
                icon.classList.remove('fa-angles-left');
                icon.classList.add('fa-angles-right');
                textElements.forEach(el => el.classList.add('hidden'));
            } else {
                sidebar.classList.remove('w-16');
                sidebar.classList.add('w-[216px]');
                icon.classList.remove('fa-angles-right');
                icon.classList.add('fa-angles-left');
                textElements.forEach(el => el.classList.remove('hidden'));
            }
        }
    </script>
</body>
</html>
